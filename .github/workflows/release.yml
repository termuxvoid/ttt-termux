name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: eugenioenko/ttt

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-version.sh

  build:
    name: build ${{ matrix.termux }}
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux aarch64
          - termux: aarch64
            goarch: arm64
            triple: aarch64-linux-android
          # Termux 32-bit ARM (go requires GOARM=7 for Android)
          - termux: arm
            goarch: arm
            goarm: "7"
            triple: armv7a-linux-androideabi
          # Termux x86_64
          - termux: x86_64
            goarch: amd64
            triple: x86_64-linux-android
          # Termux i686 (go requires GO386=sse2 for Android)
          - termux: i686
            goarch: "386"
            go386: sse2
            triple: i686-linux-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Build
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TERMUX: ${{ matrix.termux }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GO386: ${{ matrix.go386 }}
          TRIPLE: ${{ matrix.triple }}
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.termux }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.*
          if-no-files-found: error

  release:
    name: publish release
    needs: [resolve, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Merge checksums
        working-directory: dist
        run: |
          set -eu
          cat sha256sums.* | sort -k2 > SHA256SUMS
          rm sha256sums.*
          cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: TTT ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
